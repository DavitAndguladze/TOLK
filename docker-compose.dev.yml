# Local dev database (laptops can't reach the OCI MySQL HeatWave in the private subnet). ADR-0010.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tolk
      MYSQL_USER: tolk
      MYSQL_PASSWORD: tolk
    ports:
      - "${DB_PORT:-3306}:3306" # DB_PORT=3307 if a local MySQL already holds 3306
