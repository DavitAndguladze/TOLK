# Local dev database (laptops can't reach the managed DB in the private subnet).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hacktn26
    ports:
      - "${DB_PORT:-5432}:5432" # DB_PORT=5433 if a local Postgres already holds 5432
